synopsis: >-
  They took his family's company. They took his father's freedom. They took
  his mother's life. They should have taken his name off the list.

  Gao Qiang arrived in Tokyo with nothing but a name burned into his chest:
  the man who destroyed his family and vanished into Japan's corporate
  underworld. Then something found him. The Big Brother System didn't give
  him power over people — it showed him the ones worth believing in: the
  discarded, the broken, the ones the world gave up on. He didn't recruit an
  army. He built a family — one that generates money, intelligence, and a
  loyalty that doesn't break, because everything the brothers earn flows
  back into everyone.

  Now something unprecedented is growing in the backstreets of Kabukicho,
  and the yakuza families who own this city are about to learn what happens
  when broken people are pushed far enough that they find each other. Every
  empire starts with someone deciding to share their last coin with a
  stranger. His was 1,000 yen.
