synopsis: >-
  Kenji Mori, 34, senior account manager at a Tokyo trading firm, has spent
  eleven years optimizing everything except himself. Then a hallucination on
  the last Chuo rapid turns out not to be a hallucination: a System opens a
  qi ledger in his name and starts counting his breath. Cultivation, it
  turns out, fits inside a salaryman's schedule — four counts in, six counts
  out, on a crowded train, between meetings. But if qi is real, then so is
  the sector ranking the System keeps hidden, and Kenji is entering it eleven
  years late, at the very bottom, with nothing but a breathing ratio and a
  stubborn refusal to log a loss.
