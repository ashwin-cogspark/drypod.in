# CI/CD for drypod.in (revamp plan P3.1–P3.3).
#
# Triggers:
#   - pull_request -> main: content lint + content tests + build, then
#     `wrangler versions upload` (a non-production preview version) and a
#     standing comment on the PR with the preview URL.
#   - push -> main: the same checks, then `wrangler deploy` (production).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   - CLOUDFLARE_API_TOKEN  — least-privilege Cloudflare API token created from
#     the "Workers Scripts Edit" template (edit is enough; no admin scopes).
#   - CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id (Workers dashboard).
#
# Optional repository variable (Variables tab, not a secret — the sitekey is
# public and embedded in the built HTML):
#   - PUBLIC_TURNSTILE_SITE_KEY — real Turnstile sitekey. Until it is set,
#     builds fall back to Cloudflare's always-passing TEST sitekey, and with
#     no production TURNSTILE_SECRET the API skips captcha verification.
#
# NOTE (plan P3.3 — manual user step): until both secrets are added, every
# wrangler step fails with an auth error. The lint/test/build steps before it
# still run and validate the PR.

name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Superseded runs on the same branch cancel each other out.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the standing preview URL on the PR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Check Turnstile sitekey presence
        run: |
          if [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "::warning::PUBLIC_TURNSTILE_SITE_KEY not set (repo variable or secret) — build falls back to the Turnstile TEST sitekey; votes will 403 against the production TURNSTILE_SECRET."
          else
            echo "Turnstile sitekey present (${#PUBLIC_TURNSTILE_SITE_KEY} chars)."
          fi
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      - run: npm run lint:content
      - run: npm run test:content
      - run: npm run test:worker
      - name: Build
        env:
          # Accept the sitekey from either the Variables or the Secrets tab;
          # empty only when it exists in neither — the island then falls
          # back to the public Turnstile TEST sitekey (30x-fails against the
          # real TURNSTILE_SECRET, so production needs this set).
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Upload preview version (wrangler)
        id: wrangler_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 versions upload 2>&1 | tee wrangler-output.log
          # wrangler 4 prints "Version Preview URL: https://<hash>-<name>.<subdomain>.workers.dev"
          # (dash-joined). Match any workers.dev URL in the output — it is the
          # only one `versions upload` emits.
          url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler-output.log | head -n 1)"
          if [ -z "$url" ]; then
            echo "::error::No preview URL found in wrangler output:"
            cat wrangler-output.log
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        env:
          PREVIEW_URL: ${{ steps.wrangler_preview.outputs.url }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- deploy-preview -->';
            const body = `${marker}\nCloudflare preview deployment for this PR: ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const standing = comments.find((c) => c.body.includes(marker));
            if (standing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: standing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    name: Deploy (production)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Check Turnstile sitekey presence
        run: |
          if [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "::warning::PUBLIC_TURNSTILE_SITE_KEY not set (repo variable or secret) — build falls back to the Turnstile TEST sitekey; votes will 403 against the production TURNSTILE_SECRET."
          else
            echo "Turnstile sitekey present (${#PUBLIC_TURNSTILE_SITE_KEY} chars)."
          fi
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      - run: npm run lint:content
      - run: npm run test:content
      - run: npm run test:worker
      - name: Build
        env:
          # Accept the sitekey from either the Variables or the Secrets tab;
          # empty only when it exists in neither — the island then falls
          # back to the public Turnstile TEST sitekey (30x-fails against the
          # real TURNSTILE_SECRET, so production needs this set).
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to production (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
